name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      JULIA_NUM_PRECOMPILE_TASKS: '1'
      JULIA_NUM_THREADS: '2'
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1.12']
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: 'false'
      - name: Instantiate and test
        shell: bash
        run: julia --startup-file=no --check-bounds=yes --project -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
      - name: Verify original cocoa materials
        shell: bash
        run: julia --startup-file=no --project scripts/verify_cocoa.jl
